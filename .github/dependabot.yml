version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    target-branch: develop
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      # One PR for all the low-risk bumps, so review is a single pass.
      # Majors match no group, so Dependabot opens them individually —
      # which is the intent. Do not add an `ignore` rule for majors:
      # `ignore` suppresses the update entirely instead of splitting it out.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    target-branch: develop
    commit-message:
      prefix: chore
    groups:
      # Actions majors are runner-runtime bumps, not source changes,
      # so everything lands in one PR per month.
      github-actions:
        patterns: ["*"]
