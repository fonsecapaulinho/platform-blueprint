version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    target-branch: develop
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      # One PR for all the low-risk bumps, so review is a single pass.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Majors land as their own PR, reviewed deliberately — never grouped.
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    target-branch: develop
